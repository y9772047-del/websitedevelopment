<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - 大学生学习计划管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css?v=20260706-theme-shared">
    <link rel="stylesheet" href="../css/admin.css?v=20260622-css-split">
</head>
<body class="prototype-body">
<div class="admin-layout">
    <aside class="admin-sidebar">
        <h1>管理员端</h1>
        <button class="admin-menu active" data-page="adminDashboard">后台首页</button>
        <button class="admin-menu" data-page="adminUsers">用户管理</button>
        <button class="admin-menu" data-page="adminTasks">学习任务管理</button>
        <button class="admin-menu" data-page="adminFeedbacks">用户反馈管理</button>
        <button class="admin-menu" data-page="adminThemes">主题皮肤</button>
        <button class="admin-menu" id="adminLogoutBtn">退出登录</button>
    </aside>
    <main class="admin-main">
        <section id="adminDashboard" class="admin-section">
            <div class="page-heading">
                <div><span class="soft-label">Admin</span><h1 class="page-title">后台首页</h1></div>
            </div>
            <div class="row g-3 mb-4" id="adminMetrics"></div>
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="content-card">
                        <h2>最近注册用户</h2>
                        <div id="recentAdminUsers" class="stack-list"></div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="content-card">
                        <h2>最近提交反馈</h2>
                        <div id="recentAdminFeedbacks" class="stack-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="adminUsers" class="admin-section d-none">
            <div class="page-heading">
                <div><span class="soft-label">Users</span><h1 class="page-title">用户管理</h1></div>
            </div>
            <div class="content-card mb-4">
                <form id="adminUserSearchForm" class="row g-3">
                    <div class="col-md-4"><label class="form-label">用户名</label><input class="form-control" name="username" placeholder="按用户名搜索"></div>
                    <div class="col-md-8 d-flex align-items-end gap-2"><button class="btn btn-primary">搜索</button><button class="btn btn-outline-primary" type="button" onclick="resetAdminForm('adminUserSearchForm'); loadAdminUsers();">重置</button></div>
                </form>
            </div>
            <div class="content-card">
                <h2>用户列表</h2>
                <div class="table-responsive"><table class="table app-table align-middle"><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>任务数</th><th>操作</th></tr></thead><tbody id="adminUserTable"></tbody></table></div>
            </div>
        </section>

        <section id="adminTasks" class="admin-section d-none">
            <div class="page-heading">
                <div><span class="soft-label">Tasks</span><h1 class="page-title">学习任务管理</h1></div>
            </div>
            <div class="content-card mb-4">
                <form id="adminTaskSearchForm" class="row g-3">
                    <div class="col-md-2"><label class="form-label">用户名</label><input class="form-control" name="username"></div>
                    <div class="col-md-2"><label class="form-label">任务关键词</label><input class="form-control" name="keyword"></div>
                    <div class="col-md-2"><label class="form-label">优先级</label><select class="form-select" name="priority"><option value="">全部</option><option>Q0</option><option>Q1</option><option>Q2</option><option>Q3</option></select></div>
                    <div class="col-md-2"><label class="form-label">状态</label><select class="form-select" name="status"><option value="">全部</option><option>未完成</option><option>进行中</option><option>已完成</option><option>延期</option></select></div>
                    <div class="col-md-2"><label class="form-label">开始日期</label><input class="form-control" name="startDate" type="date"></div>
                    <div class="col-md-2"><label class="form-label">结束日期</label><input class="form-control" name="endDate" type="date"></div>
                    <div class="col-12"><button class="btn btn-primary">筛选</button><button class="btn btn-outline-primary ms-2" type="button" onclick="resetAdminForm('adminTaskSearchForm'); loadAdminTasks();">重置</button></div>
                </form>
            </div>
            <div class="content-card">
                <h2>任务列表</h2>
                <div class="table-responsive"><table class="table app-table align-middle"><thead><tr><th>ID</th><th>任务名称</th><th>所属用户</th><th>所属计划</th><th>分类</th><th>优先级</th><th>截止日期</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="adminTaskTable"></tbody></table></div>
            </div>
        </section>

        <section id="adminFeedbacks" class="admin-section d-none">
            <div class="page-heading">
                <div><span class="soft-label">Feedback</span><h1 class="page-title">用户反馈管理</h1></div>
            </div>
            <div class="content-card mb-4">
                <form id="adminFeedbackSearchForm" class="row g-3">
                    <div class="col-md-3"><label class="form-label">用户名</label><input class="form-control" name="username"></div>
                    <div class="col-md-3"><label class="form-label">处理状态</label><select class="form-select" name="status"><option value="">全部</option><option>未处理</option><option>已处理</option><option>已忽略</option></select></div>
                    <div class="col-md-3"><label class="form-label">关键词</label><input class="form-control" name="keyword"></div>
                    <div class="col-md-3 d-flex align-items-end gap-2"><button class="btn btn-primary">筛选</button><button class="btn btn-outline-primary" type="button" onclick="resetAdminForm('adminFeedbackSearchForm'); loadAdminFeedbacks();">重置</button></div>
                </form>
            </div>
            <div class="content-card">
                <h2>反馈列表</h2>
                <div class="table-responsive"><table class="table app-table align-middle"><thead><tr><th>ID</th><th>提交用户</th><th>反馈内容摘要</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="adminFeedbackTable"></tbody></table></div>
            </div>
        </section>

        <section id="adminThemes" class="admin-section d-none">
            <div class="page-heading">
                <div>
                    <span class="soft-label">Theme Center</span>
                    <h1 class="page-title">主题皮肤中心</h1>
                    <p class="muted-text mt-2 mb-0">选择管理员后台界面风格，保持和学生端一致的主题体验。</p>
                </div>
            </div>
            <div class="content-card mb-4">
                <div class="card-title-row">
                    <h2>当前使用主题</h2>
                    <span id="currentThemeBadge" class="badge soft-badge">浅粉暖色</span>
                </div>
                <p id="currentThemeDesc" class="muted-text mb-0">适合温柔清爽的学习风格</p>
            </div>
            <div class="row g-4" id="themeCardList"></div>
        </section>
    </main>
</div>

<div class="modal fade" id="adminDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content admin-modal">
            <div class="modal-header">
                <h5 class="modal-title" id="adminDetailTitle">详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="adminDetailBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260601-admin"></script>
<script src="../js/admin.js?v=20260705-login-blue-cache"></script>
</body>
</html>
