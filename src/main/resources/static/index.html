<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 大学生学习计划管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=20260706-theme-shared">
    <link rel="stylesheet" href="css/auth.css?v=20260705-login-blue">
</head>
<body class="prototype-body theme-blue">
<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">大学生学习计划管理系统</a>
        <span class="navbar-text d-none d-md-inline">学习计划 · 任务执行 · 复盘统计</span>
    </div>
</nav>

<main class="login-wrap">
    <section class="login-hero" aria-label="系统介绍">
        <div class="hero-kicker">学习节奏，从这里梳理清楚</div>
        <h1>大学生学习计划管理系统</h1>
        <p class="hero-summary">用一个清晰的工具管理计划、任务、记录与改进。</p>
        <div class="hero-feature-grid">
            <div class="hero-feature-card">
                <span class="feature-icon">01</span>
                <strong>学习计划管理</strong>
                <small>制定个性化学习计划，合理安排学习时间。</small>
            </div>
            <div class="hero-feature-card">
                <span class="feature-icon">02</span>
                <strong>任务执行跟踪</strong>
                <small>跟踪任务完成进度，保持学习节奏不掉队。</small>
            </div>
            <div class="hero-feature-card">
                <span class="feature-icon">03</span>
                <strong>复盘统计分析</strong>
                <small>多维度数据统计分析，复盘总结，持续改进。</small>
            </div>
        </div>
        <p class="hero-footnote">帮助你更清楚地安排目标、追踪进度，并形成持续改进的学习闭环。</p>
    </section>

    <section class="login-card" aria-label="登录注册">
        <div class="mb-4">
            <span class="soft-label">课程项目原型</span>
            <h1 class="page-title mt-3">欢迎回来</h1>
            <p class="muted-text mb-0">登录后继续管理你的学习计划与任务。</p>
        </div>

        <ul class="nav nav-pills soft-tabs mb-4" id="loginTabs">
            <li class="nav-item">
                <button class="nav-link active" type="button" data-target="loginForm">登录</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-target="registerForm">注册</button>
            </li>
        </ul>

        <form id="loginForm" class="auth-form">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input class="form-control" name="username" value="student" placeholder="请输入用户名" required>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input class="form-control" name="password" type="password" value="123456" placeholder="请输入密码" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label" for="rememberMe">记住我</label>
                </div>
                <a class="soft-link" href="#">忘记密码</a>
            </div>
            <button class="btn btn-primary w-100" type="submit">进入系统</button>
        </form>

        <form id="registerForm" class="auth-form d-none">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input class="form-control" name="username" placeholder="例如 student02" required>
            </div>
            <div class="mb-3">
                <label class="form-label">姓名</label>
                <input class="form-control" name="realName" placeholder="请输入姓名">
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input class="form-control" name="password" type="password" placeholder="请设置密码" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">创建账号</button>
        </form>

        <div class="demo-note mt-4" id="authMessage">
            测试账号：student / 123456
        </div>
    </section>
</main>


<script src="js/auth.js"></script>
</body>
</html>
