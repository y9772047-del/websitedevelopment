name: Build and test

on:
  push:
    branches: [main, master, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.java }} and Vue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Vue dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test Vue frontend
        working-directory: frontend
        run: pnpm test
      - name: Build Vue frontend for Spring Boot
        working-directory: frontend
        run: pnpm build
      - name: Build and run Java tests
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload application JAR
        if: success() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: study-plan-application
          path: target/study-plan-system-*.jar
          if-no-files-found: error
          retention-days: 7
